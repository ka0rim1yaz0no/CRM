name: CI

on:
  push:
    branches:
      - main
      - security-data-check
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Build frontend
        run: npm run build

      - name: Typecheck backend
        run: npm run typecheck --prefix backend

      - name: Compile backend for native Node
        run: npm run build:production --prefix backend

      - name: Check compiled application imports
        working-directory: backend
        run: node --input-type=module -e "await import('./dist/backend/src/app.js')"

      - name: Test compiled backend with synthetic data
        run: npm run test:production --prefix backend

      - name: Run backend tests
        working-directory: backend
        shell: bash
        run: npx tsx --test --test-concurrency=2 $(find src -type f -name '*.test.ts' -print)

      - name: Run frontend attendance, security and payroll regressions
        run: node --test scripts/*.test.mjs

      - name: Run blocking lint
        run: npm run lint

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e # v3.99.3
        with:
          extra_args: --results=verified,unknown
